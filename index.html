<script type="module">
  /* ===== Data imports (static) ===== */
  import HIRAGANA from "./hiragana.js";
  import KATAKANA from "./katakana.js";
  // do NOT import kanjin5.js statically; we will load it lazily via import()

  /* ===== App State ===== */
  const state = {
    type: "hiragana", // active base: 'hiragana' | 'katakana'
    datasets: {
      hiragana: HIRAGANA.slice(),
      katakana: KATAKANA.slice(),
      kanji: null, // loaded lazily
    },
    includeKanji: false, // whether to merge kanji into the current view
    data: [], // currently visible items (derived)
    original: [], // baseline original for reset
    // mastered sets per origin
    mastered: {
      hiragana: new Set(
        JSON.parse(localStorage.getItem("mastered.hiragana") || "[]")
      ),
      katakana: new Set(
        JSON.parse(localStorage.getItem("mastered.katakana") || "[]")
      ),
      kanji: new Set(
        JSON.parse(localStorage.getItem("mastered.kanji") || "[]")
      ),
    },
    singleView: false,
    focusedIndex: 0,
    filterUnread: false,
  };

  /* ===== DOM refs ===== */
  const cardsList = document.getElementById("cardsList");
  const toggleBtns = document.querySelectorAll(".toggle-group button");
  const gridBtn = document.getElementById("gridBtn");
  const singleBtn = document.getElementById("singleBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const resetBtn = document.getElementById("resetBtn");
  const filterUnread = document.getElementById("filterUnread");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const progressPercent = document.getElementById("progressPercent");
  const singleNav = document.getElementById("singleNav");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const markBtn = document.getElementById("markBtn");
  const darkToggle = document.getElementById("darkToggle");

  // add Include Kanji control into the controls area dynamically (if there's room)
  const controlsBar = document.querySelector(".controls");
  const includeKanjiWrapper = document.createElement("div");
  includeKanjiWrapper.className = "filter";
  includeKanjiWrapper.style.alignItems = "center";
  includeKanjiWrapper.innerHTML = `
    <input id="includeKanji" type="checkbox" aria-label="Tambahkan Kanji N5" />
    <label for="includeKanji" style="margin-left:6px">Tambahkan Kanji N5</label>
  `;
  controlsBar.appendChild(includeKanjiWrapper);
  const includeKanjiCheckbox = document.getElementById("includeKanji");

  /* ===== Helpers ===== */
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function saveMasteredToStorage() {
    localStorage.setItem(
      "mastered.hiragana",
      JSON.stringify([...state.mastered.hiragana])
    );
    localStorage.setItem(
      "mastered.katakana",
      JSON.stringify([...state.mastered.katakana])
    );
    localStorage.setItem(
      "mastered.kanji",
      JSON.stringify([...state.mastered.kanji])
    );
  }

  /* ===== Dynamic kanji loader (lazy) ===== */
  async function ensureKanjiLoaded() {
    if (state.datasets.kanji) return state.datasets.kanji;
    try {
      const mod = await import("./kanjin5.js");
      const arr = (mod.default || mod).slice();
      // ensure each kanji has origin: 'kanji'
      arr.forEach((it) => {
        if (!it.origin) it.origin = "kanji";
      });
      state.datasets.kanji = arr;
      return arr;
    } catch (err) {
      console.error("Failed to load kanji:", err);
      return null;
    }
  }

  /* ===== Build current view (merge without duplicates) ===== */
  function rebuildCurrentDataPreserveMastery() {
    const base = state.datasets[state.type]
      ? state.datasets[state.type].slice()
      : [];
    let combined = base.slice();
    if (state.includeKanji && state.datasets.kanji) {
      const existing = new Set(combined.map((it) => it.kana));
      state.datasets.kanji.forEach((k) => {
        if (!existing.has(k.kana)) combined.push(k);
      });
    }
    state.data = combined;
    state.original = combined.slice();
  }

  /* ===== Render functions ===== */
  function renderCards() {
    cardsList.innerHTML = "";
    let data = state.data.slice();

    if (state.filterUnread) {
      data = data.filter((item) => {
        // item.origin may be 'kanji' or undefined (assume base)
        const origin = item.origin === "kanji" ? "kanji" : state.type;
        return !state.mastered[origin].has(item.kana);
      });
    }

    data.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "card fade";
      card.tabIndex = 0;
      card.setAttribute("role", "listitem");
      card.setAttribute(
        "aria-label",
        `${item.kana} card. Romaji ${item.romaji || item.reading || ""}`
      );
      card.dataset.index = idx;

      const inner = document.createElement("div");
      inner.className = "inner";

      const front = document.createElement("div");
      front.className = "face front";
      front.innerHTML = `<div class="front">${item.kana}</div>`;

      const back = document.createElement("div");
      back.className = "face back";
      back.innerHTML = `
        <div class="romaji">${item.romaji || item.reading || ""}</div>
        <div class="example">${item.exampleKana || ""} — <em>${
        item.exampleRomaji || ""
      }</em></div>
        <div class="meaning">${item.meaning || ""}</div>
      `;

      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);

      // show mastered badge if item mastered in relevant set
      const origin = item.origin === "kanji" ? "kanji" : state.type;
      const isMastered =
        state.mastered[origin] && state.mastered[origin].has(item.kana);
      if (isMastered) {
        const badge = document.createElement("div");
        badge.className = "mastered-badge";
        badge.textContent = "Hafal";
        card.appendChild(badge);
      }

      // handlers
      card.addEventListener("click", () => toggleFlip(card));
      card.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          toggleFlip(card);
        }
        if (state.singleView) {
          if (ev.key === "ArrowLeft") prevCard();
          if (ev.key === "ArrowRight") nextCard();
        }
      });

      cardsList.appendChild(card);
    });

    updateProgress();

    if (state.singleView) {
      document.body.classList.add("single-view");
      singleNav.style.display = "";
      focusSingleCard();
    } else {
      document.body.classList.remove("single-view");
      singleNav.style.display = "none";
    }
  }

  function toggleFlip(card) {
    card.classList.toggle("flipped");
  }

  function updateProgress() {
    const total = state.data.length;
    const visibleKanas = new Set(state.data.map((it) => it.kana));
    let masteredCount = 0;
    const counted = new Set();
    // check each mastered set and count only those visible now
    Object.keys(state.mastered).forEach((origin) => {
      state.mastered[origin].forEach((k) => {
        if (visibleKanas.has(k) && !counted.has(k)) {
          counted.add(k);
          masteredCount++;
        }
      });
    });

    const percent = total === 0 ? 0 : Math.round((masteredCount / total) * 100);
    progressText.textContent = `${masteredCount} / ${total} telah dikuasai`;
    progressPercent.textContent = `${percent}%`;
    progressFill.style.width = `${percent}%`;
    const bar = document.querySelector(".progress-line");
    if (bar) bar.setAttribute("aria-valuenow", percent);
  }

  /* ===== Controls behaviour ===== */

  // initial data
  rebuildCurrentDataPreserveMastery();
  renderCards();

  // kana toggle
  toggleBtns.forEach((btn) =>
    btn.addEventListener("click", () => {
      toggleBtns.forEach((b) => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      const type = btn.dataset.type;
      if (type === state.type) return;
      state.type = type;
      state.focusedIndex = 0;
      rebuildCurrentDataPreserveMastery();
      renderCards();
    })
  );

  // grid/single
  gridBtn.addEventListener("click", () => {
    state.singleView = false;
    gridBtn.classList.add("primary");
    singleBtn.classList.remove("primary");
    renderCards();
  });
  singleBtn.addEventListener("click", () => {
    state.singleView = true;
    singleBtn.classList.add("primary");
    gridBtn.classList.remove("primary");
    renderCards();
  });

  // shuffle
  shuffleBtn.addEventListener("click", () => {
    state.data = shuffleArray(state.data);
    renderCards();
    cardsList.style.transform = "translateY(6px)";
    setTimeout(() => (cardsList.style.transform = "none"), 180);
  });

  // reset (reset only visible progress unless you want full)
  resetBtn.addEventListener("click", () => {
    // reset mastered only for current visible origins
    const originsToReset = new Set();
    if (state.includeKanji) originsToReset.add("kanji");
    originsToReset.add(state.type);
    originsToReset.forEach((o) => (state.mastered[o] = new Set()));
    saveMasteredToStorage();
    state.data = state.original.slice();
    state.filterUnread = false;
    filterUnread.checked = false;
    renderCards();
  });

  // filter unread
  filterUnread.addEventListener("change", (e) => {
    state.filterUnread = e.target.checked;
    renderCards();
  });

  // dark mode
  darkToggle.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark");
    darkToggle.setAttribute("aria-pressed", String(isDark));
  });

  /* ===== Include Kanji toggle (lazy load) ===== */
  includeKanjiCheckbox.addEventListener("change", async (e) => {
    if (e.target.checked) {
      const k = await ensureKanjiLoaded();
      if (!k) {
        e.target.checked = false;
        return;
      }
    }
    state.includeKanji = e.target.checked;
    rebuildCurrentDataPreserveMastery();
    renderCards();
  });

  /* ===== Single navigation & marking ===== */
  function focusSingleCard() {
    const cards = Array.from(cardsList.children);
    if (cards.length === 0) return;
    if (state.focusedIndex < 0) state.focusedIndex = 0;
    if (state.focusedIndex >= cards.length)
      state.focusedIndex = cards.length - 1;
    cards.forEach((c, i) => {
      c.style.display = i === state.focusedIndex ? "" : "none";
    });
    const visible = cards[state.focusedIndex];
    if (visible) visible.focus();
  }

  prevBtn.addEventListener("click", prevCard);
  nextBtn.addEventListener("click", nextCard);

  function prevCard() {
    state.focusedIndex = Math.max(0, state.focusedIndex - 1);
    focusSingleCard();
  }
  function nextCard() {
    const cards = Array.from(cardsList.children);
    state.focusedIndex = Math.min(cards.length - 1, state.focusedIndex + 1);
    focusSingleCard();
  }

  // mark as mastered
  markBtn.addEventListener("click", () => {
    const cards = Array.from(cardsList.children);
    if (cards.length === 0) return;
    const current = cards[state.focusedIndex];
    if (!current) return;
    const idx = Number(current.dataset.index);
    const item = state.filterUnread
      ? state.data.filter((it) => !isItemMastered(it))[idx]
      : state.data[idx];
    if (!item) return;
    markItemAsMasteredByKana(item.kana, item);
    renderCards();
  });

  function isItemMastered(item) {
    const origin = item.origin === "kanji" ? "kanji" : state.type;
    return state.mastered[origin] && state.mastered[origin].has(item.kana);
  }

  function markItemAsMasteredByKana(kanaStr, item = null) {
    // deduce origin by existence in kanji dataset or item.origin
    let origin = state.type;
    if (item && item.origin === "kanji") origin = "kanji";
    else if (
      state.datasets.kanji &&
      state.datasets.kanji.some((k) => k.kana === kanaStr)
    )
      origin = "kanji";
    // fallback to current base
    state.mastered[origin].add(kanaStr);
    saveMasteredToStorage();
  }

  /* ===== Accessibility global handlers ===== */
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const el = document.activeElement;
      if (el && el.tagName === "BUTTON") el.click();
    }
    if (state.singleView) {
      if (e.key === "ArrowLeft") prevCard();
      if (e.key === "ArrowRight") nextCard();
    }
  });

  /* ===== Optional audio (kept minimal) ===== */
  async function playAudioFor(kana) {
    try {
      const audioPath = `assets/audio/${kana}.mp3`;
      const a = new Audio(audioPath);
      await a.play();
    } catch (err) {
      // ignore missing audio
    }
  }

  /* ===== End of script ===== */
</script>
